name: End-to-End MLOps Pipeline
on: [push]

jobs:
  ci-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest 

      - [cite_start]name: Run Unit Tests
        [cite_start]run: pytest app/tests/

      - [cite_start]name: Build Docker Image
        run: docker build -t pet-adoption-model:latest .

  cd-stage:
    needs: ci-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - [cite_start]name: Deploy via Docker Compose
        run: docker-compose up -d

      - [cite_start]name: Smoke Test
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1
